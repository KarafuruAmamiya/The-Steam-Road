l_english:
 # Latin Republic
 je_latin_republic: "The Latin Republic"
 je_latin_republic_reason: "During the Italian Revolutionary Wars, one of the ambitions of Great Doge di Santini were a grand project to liberate the peoples of the Balkans and Greece from the centuries-long grip of the #bold Ottoman Empire#!, and his ambitions included even Constantinople itself. While he partially succeeded with the creation of the #bold Greek Sister Republic#!, his defeat meant most Balkan territories still remained under the Ottomans for the next decades, and his plan ultimately failed to curb Ottoman influence in Europe.\n\nShould we continue the project, we may be able to ensure the Ottoman Empire will no longer be a thorn in our side for the foreseeable future. It may be best to take into account the interests of our own Greek subjects to ensure their cooperation — or perhaps not."
 
 je_latin_republic_transfer_state_button: "Expand Greek Subject"
 je_latin_republic_transfer_state_button_desc: "Transfer control of all Greek, West Balkans, and Anatolian holdings to our subject."
 je_latin_republic_form_latin_rep_button: "Form Latin Republic"
 je_latin_republic_form_latin_rep_button_desc: "With the liberation of Greek territories in the Balkans and Anatolia, it is time to proclaim our subject as a new Roman republic."
 
 own_all_greece_states: "Every states in the Greece [concept_strategic_region] are controlled by us or our subjects"
 modifier_latin_republic_fail: "The Greek Fiasco"
 ita_latin_republic_pursuit: "Pursuing the Latin Republic"
 no_latin_republic: "Rejected the Latin Republic Project"
 dismiss_latin_republic_tt: "The 'Latin Republic' Journal Entry will be dismissed"
 formed_latin_republic: "We have taken the 'Form Latin Republic' decision."
 greece_still_counts: "This still counts as forming the Latin Republic!"
 
 latin_republic.1.t: "The Pursuit of a Latin Republic"
 latin_republic.1.d: "Inspired by the legacy of the Latin Empire established by the Crusaders in the early 13th century, Great Doge di Santini once envisioned a sister republic centering around Greek territories, which he dubs the Latin Republic. This republic would be styled after the ideals of the Italian Revolution, promoting liberty, equality, and fraternity among its citizens."
 latin_republic.1.f: "During the Italian Revolutionary Wars of the mid to late 18th century, the Great Doge launched a series of military campaigns aimed at liberating the Balkans and Greece. However, di Santini's ambitions ultimately prove to be too grandiose with resources stretched thin by ongoing conflicts across Europe and facing staunch opposition from both the Ottoman Empire and other European powers wary of Italian expansion. While the Great Doge liberated a portion of Greece, he was unable to fully realize his vision for the Latin Republic.\n\nNow, the [SCOPE.gsInterestGroup('latin_rep_leader').GetName] petitioned for us to continue di Santini's visions, hoping to curb Ottoman influence in Europe for once and all. However, it is obvious that this will be a costly endeavor."
 latin_republic.1.a: ""Dei gratia imperator Romaniae et semper augustus.""
 latin_republic.1.b: "This is an absurd notion."
 rejected_latin_republic_tt: "We rejected pursuing the Latin Republic"
 
 latin_republic.2.t: "Light of the Balkans"
 
 latin_republic.3.t: "A Rising Threat Beyond the Bosphorus"
 
 latin_republic.4.t: "The Fourth Rome"
 latin_republic.4.d: ""Audaces fortuna iuvat" – fortune favors the bold indeed. Against all odds, we have completed Great Doge di Santini's ambitions in the Balkans. Now, our biggest hurdle is of course, administering the new territories."
 latin_republic.4.f: "Our campaigns were met with both fierce resistance and eager support from various factions within the Balkans and Greece. While some saw us as a liberator from Ottoman oppression, others were wary of exchanging one imperial power for another. Nevertheless, brazenly proclaiming a new Rome may be an opportunity to gain momentum against the Ottomans."
 latin_republic.4.a: "A new era for the Balkans and beyond!"
 latin_republic.4.b: "Greece shall remain Greece."
 
