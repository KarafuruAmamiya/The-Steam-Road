  poland_lithuania_events.5.t: "Union of Augustów"
  poland_lithuania_events.5.d: "After years of negotiations, [SCOPE.sCountry('pol_scope').GetName] and [SCOPE.sCountry('lit_scope').GetName] have finally reached an agreement to unify their governance into a single entity. [SCOPE.sCharacter('poland_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('poland_ruler_scope').GetFullName] [SCOPE.sCharacter('poland_ruler_scope').GetHerHim]self oversaw the ratification of the union in Augustów, succeeding in what Sigismund II tried to achieve over 300 years ago."
  poland_lithuania_events.5.f: ""For too long, we have faltered in the annals of history. For too long, we have been subjugated and ridiculed by those who seek to carve us up among themselves. But no more. Today, we come together in unity and solidarity to forge a new path forward under one banner. Let us become a symbol of hope for our brethrens who still chafed under foreign yoke. Let us build a future that is worthy of our ancestors' dreams and aspirations. Long live Poland! Long live Lithuania!""
  poland_lithuania_events.5.a: "Niech żyje Polska! Tegyvuoja Lietuva!"
  poland_lithuania_events.5.b: "The contributions of [SCOPE.gsInterestGroup('ruler_ig_scope').GetName] have made the unification  possible."
  plc_unifier_prestige: "Polish-Lithuanian Unification"
  plc_unifiers_ig: "Polish-Lithuanian Unifiers"
  plc_unifiers_ruler: "Unified Poland-Lithuania"
  
  poland_lithuania_events.6.t: "A Union Never Meant to Be"
  poland_lithuania_events.6.d: "Despite our best efforts, negotiations have once again faltered. Rather than repeating the failures of the First Union, perhaps it is time to accept that the futures of [SCOPE.sCountry('pol_scope').GetName] and [SCOPE.sCountry('lit_scope').GetName] are meant to diverge."
  poland_lithuania_events.6.f: ""Those Poles really think that they can deceive us with the exact same tricks as before and expect us to fall for it. Well, I say to them, how about not spouting nonsensical rhetoric about unity and strength while conveniently ignoring the fact that [SCOPE.sCountry('lit_scope').GetName] had been doing just fine on its own, thank you very much.""
  poland_lithuania_events.6.a: "Damn them!"
  
  DIPLOMATIC_ACCEPTANCE_LITHUANIA: "They demand a proper procedure for the unification"