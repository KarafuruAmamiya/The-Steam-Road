l_english:
 #Balkan Crisis
 je_balkan_crisis_tur: "The Balkan Insurgency"
 je_balkan_crisis_tur_reason: "The recent crises engulfing [SCOPE.sCountry('tur_scope').GetName] has caused the state of [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] administration in the Balkans to deteriorate. Turmoil and insurrection have engulfed the region despite [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] efforts to restore order, while neighboring powers have began taking advantage of the situation to weaken [SCOPE.sCountry('tur_scope').GetName]'s strongholds in Europe. If [SCOPE.sCountry('tur_scope').GetName] fail to regain control of the region, we may risk a complete loss of control of our European subjects.\n\nOverall #bold Balkan Crisis#! is expected to progress by #tooltippable;tooltip:[Country.GetTooltipTag],je_balkan_crisis_special_tooltip [GetGlobalVariable('balkan_crisis_main_var_next').GetValue|-=]#! next month. If this value is too high, we may become vulnerable to aggression from European powers.\n\nReleasing a Balkan country will reduce the #bold Balkan Crisis#! progress by #variable 20#! each, but risks lowering our hold of the Balkans."
 je_balkan_crisis_special_tooltip: "This rate is determined by the following:\n#variable [GetGlobalVariable('balkan_unrest_from_greeks').GetValue|-=]#! from Greek [concept_turmoil]\n#variable [GetGlobalVariable('balkan_unrest_from_serbs').GetValue|-=]#! from Serbian [concept_turmoil]\n#variable [GetGlobalVariable('balkan_unrest_from_croats').GetValue|-=]#! from Croatian [concept_turmoil]\n#variable [GetGlobalVariable('balkan_unrest_from_bulgarians').GetValue|-=]#! from Bulgarian [concept_turmoil]\n#variable [GetGlobalVariable('balkan_unrest_from_laws').GetValue|-=]#! from #bold Home Affairs#! and #bold Policing#! [Concept('concept_law','$concept_laws$')] and [Concept('concept_institution', '$concept_institutions$')]\n#variable [GetGlobalVariable('balkan_unrest_var_add').GetValue|-=]#! from other effects"
 balkan_crisis_uneasy: "Current Tension: Unrest"
 balkan_crisis_volatile: "Current Tension: #o Volatile#!"
 balkan_crisis_turbulent: "Current Tension: #red Turbulent#!"
 
 je_balkan_crisis_display: "The Balkan Insurgency"
 je_balkan_crisis_display_reason: "The recent crises engulfing [SCOPE.sCountry('tur_scope').GetName] has caused the state of [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] administration in the Balkans to deteriorate. Turmoil and insurrection have engulfed the region despite [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] efforts to restore order, while neighboring powers have began taking advantage of the situation to weaken [SCOPE.sCountry('tur_scope').GetName]'s strongholds in Europe. If [SCOPE.sCountry('tur_scope').GetName] fail to regain control of the region, they may risk a complete loss of control of their European subjects.\n\nOverall #bold Balkan Crisis#! is expected to progress by #tooltippable;tooltip:[Country.GetTooltipTag],je_balkan_crisis_special_tooltip [GetGlobalVariable('balkan_crisis_main_var_next').GetValue|-=]#! next month. Once the value becomes high enough, we may be able to stage an intervention in the Balkans, provided we are at least a [concept_great_power]."
 
 je_war_of_the_balkan_coalition_attacker: "War of the Balkan Coalition"
 je_war_of_the_balkan_coalition_attacker_reason: "The [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting]'s violence in the #bold Balkan Insurgency#! has gone too far. Let us launch a punitive campaign to liberate the [SCOPE.sCulture('crisis_culture').GetName] people — and further our own interests in the Balkans, of course."
 je_war_of_the_balkan_coalition_defender: "War of the Balkan Coalition"
 je_war_of_the_balkan_coalition_defender_reason: "[SCOPE.sCountry('attacker_scope').GetName] has formed a coalition to undermine [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] sovereignty in the Balkans. No matter what, if we hope to maintain our rule in Europe, we must defend ourselves to the last blood."
 croatia_liberated: "Croatia is liberated."
 
 balkan_crisis.1.t: "Tension in the Balkan Provinces"
 balkan_crisis.1.d: "Economic hardships, agricultural shortages, and various internal crises within our empire has destabilized our Balkan holdings, and separatism is in an all-time high. If we do not handle the unrest swiftly, we risk losing control of them, or worse, become ripe preys for our European rivals."
 balkan_crisis.1.f: ""Did you hear about what happened in Bosnia? They say the [SCOPE.sCountry('tur_scope').GetName] are cracking down harder than ever."\n\n"The taxes are crushing us, and now they're sending soldiers to quash any dissent."\n\n"But who will stand with us? Even those who supposedly pledged their aid have their own interests in mind.""
 balkan_crisis.1.a: "We have to act quickly."
 
 balkan_crisis.2.t: "Increased Tension in [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] Balkans"
 balkan_crisis.2.d: "Economic hardships, agricultural shortages, and various internal crises within [SCOPE.sCountry('tur_scope').GetName] has destabilized their Balkan holdings, and separatism is in an all-time high. With the [SCOPE.sCountry('tur_scope').GetName]'s waning influence in Europe, this may be our chance to finally undermine the Turks."
 balkan_crisis.2.f: ""My esteemed colleagues, the Serene Republic seeks only to safeguard the interests of our oppressed brethen. We cannot stand idly by while they suffer under the Turkish tyranny."\n\n"The Ottoman Empire's decline presents an opportunity to liberate our Slavic brothers. The King of Poland is also prepared to defend the Christians in the Balkans if necessary."\n\n"We cannot act rashly. We may have interest in the Balkans, but maintaining the power balance in Europe is also a French interest.""
 balkan_crisis.2.a: "We shall watch the situation closely."
 balkan_crisis.2.b: "Let us not get involved."
 
 balkan_crisis.3.t: "The [SCOPE.sState('crisis_state').GetName] Uprising"
 balkan_crisis.3.d: "[SCOPE.sCulture('crisis_culture').GetName] insurrectionaries has risen in [SCOPE.sState('crisis_state').GetName], taking advantage of political instability within the empire to press their demands for an independent [SCOPE.sCulture('crisis_culture').GetName] state. They have also committed killing, arson of property and homes, and seizure of assets towards Turkish and Muslim populations who tried to resist."
 balkan_crisis.3.f: ""Our sacrifice will ignite the flames of revolution. Our blood will water the seeds of liberty. Our names will be etched in the annals of history. Let us make our future this day, my comrades.""
 balkan_crisis.3.a: "We cannot let it escalate further!"
 balkan_crisis_progress_increase_10_tt: "The progress of #bold Balkan Insurgency#! increases by #variable 10#!"
 balkan_uprising: "Spreading Insurgency"
 
 balkan_crisis.4.t: "Uprising Spreads to [SCOPE.sCulture('crisis_culture').GetName] States"
 balkan_crisis.4.d: ""
 balkan_crisis.4.f: ""
 balkan_crisis.4.a: "Send in the #italic bashi-bazouk#!."
 balkan_crisis.4.b: "The #italic bashi-bazouk#! cannot be trusted, let us send regular army detachments instead."
 
 balkan_crisis.5.t: "[SCOPE.sState('crisis_state').GetName] Massacre"
 balkan_crisis.5.d: "News of apparent mass civilian casualties and massacres of entire villages, perpetrated by our own forces in [SCOPE.sState('crisis_state').GetName], has reached ears in the Porte. Given how many eyes are watching us, this will undoubtedly smear our international reputation."
 balkan_crisis.5.f: ""Where are the beys!? Who had the good idea to arm the irregulars and let them loose on towns and villages!? Send the officials, we need to pacify them before foreign investigators arrive!""
 balkan_crisis.5.a: "This is a disaster!"
 balkan_crisis_progress_increase_20_tt: "The progress of #bold Balkan Insurgency#! increases by #variable 20#!"
 
 balkan_crisis.6.t: "Quelling the Uprising"
 balkan_crisis.6.d: ""
 balkan_crisis.6.f: ""
 balkan_crisis.6.a: ""
 
 balkan_crisis.7.t: "End of the [SCOPE.sState('crisis_state').GetName] Uprising"
 balkan_crisis.7.d: ""
 balkan_crisis.7.f: ""
 balkan_crisis.7.a: ""
 
 balkan_crisis.8.t: "Public Outrage over [SCOPE.sState('crisis_state').GetName] Massacre"
 balkan_crisis.8.d: "Reports and articles over [SCOPE.sCountry('tur_scope').GetName]'s violent repression of the [SCOPE.sState('crisis_state').GetName] Uprising and massacres of the [SCOPE.sCulture('crisis_culture').GetName] people has begun pouring in. The resulting outrage has completely shifted public opinion of [SCOPE.sCountry('tur_scope').GetName] even in the most Turcophile countries."
 balkan_crisis.8.f: ""It was a heap of skulls, intermingled with bones from all parts of the human body, skeletons nearly entire and rotting, clothing, human hair and putrid flesh lying there in one foul heap, around which the grass was growing luxuriantly. It emitted a sickening odour, like that of a dead horse, and it was here that the dogs had been seeking a hasty repast when our untimely approach interrupted them ... The ground is covered here with skeletons, to which are clinging articles of clothing and bits of putrid flesh. The air was heavy, with a faint, sickening odour, that grows stronger as we advance. It is beginning to be horrible.""
 balkan_crisis.8.a: "Horrific!"
 
 balkan_crisis.9.t: "[SCOPE.sCountry('tur_scope').GetCapital.GetCityHubName] Conference"
 balkan_crisis.9.d: "With the escalating #bold Balkan Insurgency#! within [SCOPE.sCountry('tur_scope').GetName], the Great Powers of Europe; [SCOPE.sCountry('gp_1_scope').GetName], [SCOPE.sCountry('gp_2_scope').GetName], [SCOPE.sCountry('gp_3_scope').GetName], [SCOPE.sCountry('gp_4_scope').GetName], and [SCOPE.sCountry('gp_5_scope').GetName] agreed on a project for political reforms in affected Ottoman territories."
 balkan_crisis.9.f: "The conference envisaged the creation of an autonomous province with substantial [SCOPE.sCulture('crisis_culture').GetName] autonomy. While [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] representatives participated in the plenaries of the conference, they were not invited to the preceding working sessions at which the Great Powers negotiated and elaborated their agreement. Now, all that awaits is the [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] response and hoped cooperation."
 balkan_crisis.9.a: "Let us hope for the best."
 
 balkan_crisis.10.t: "[SCOPE.sCountry('tur_scope').GetCapital.GetCityHubName] Conference"
 balkan_crisis.10.d: "With the escalating #bold Balkan Insurgency#! within [SCOPE.sCountry('tur_scope').GetName], the Great Powers of Europe; [SCOPE.sCountry('gp_1_scope').GetName], [SCOPE.sCountry('gp_2_scope').GetName], [SCOPE.sCountry('gp_3_scope').GetName], [SCOPE.sCountry('gp_4_scope').GetName], and [SCOPE.sCountry('gp_5_scope').GetName] agreed on a project for political reforms in affected Ottoman territories."
 balkan_crisis.10.f: ""A matter of international cooperation, you say? It seems more like a capitulation to the whims of foreign powers! How can we stand idly by as they carve up our territories?"\n\n"We cannot simply acquiesce to the demands of these foreign powers. Our sovereignty is at stake!"\n\n"While I understand your apprehensions, we must also acknowledge the reality of our situation. [SCOPE.sCountry('tur_scope').GetName] is facing immense pressure from all sides.""
 balkan_crisis.10.a: "We cannot further antagonize European powers."
 balkan_crisis.10.b: "As if we'd accept something like this!"
 balkan_crisis_progress_decrease_30_tt: "The progress of #bold Balkan Insurgency#! decreases by #variable 30#!"
 balkan_crisis_progress_increase_30_tt: "The progress of #bold Balkan Insurgency#! increases by #variable 30#!"
 refused_constantinople_conference_tt: "#red We may face retaliation from a Great Power!#!"
 macedonia_created_as_subject: "We will release Macedonia as our subject"
 croatia_created_as_subject: "We will release Croatia as our subject"
 serbia_created_as_subject: "We will release Serbia as our subject"
 bulgaria_created_as_subject: "We will release Bulgaria as our subject"
 macedonia_created: "We will release Macedonia as an independent country"
 croatia_created: "We will release Croatia as an independent country"
 serbia_created: "We will release Serbia as an independent country"
 bulgaria_created: "We will release Bulgaria as an independent country"
 
 balkan_crisis.11.t: "Blood in the Water"
 balkan_crisis.11.d: "[SCOPE.sCountry('tur_scope').GetName]'s decision to disregard the results of the [SCOPE.sCountry('tur_scope').GetCapital.GetCityHubName] Conference has further deteriorated their relations with other European Great Powers. With anti-[SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] sympathies running high throughout Europe due to the [SCOPE.sCulture('crisis_culture').GetName] atrocities and the rejection of the [SCOPE.sCountry('tur_scope').GetCapital.GetCityHubName] agreements, there may no be a better time to declare war than this."
 balkan_crisis.11.f: ""Prepare our forces for mobilization. We cannot allow the oppression of our fellow Christians to go unchallenged. Make it clear to [SCOPE.sCountry('tur_scope').GetName] that [ROOT.GetCountry.GetName] will not tolerate further oppression of our brethen in the Balkans. Let us hope that they come to their senses before it's too late.""
 balkan_crisis.11.a: "We shall liberate the Balkans and Danube from [SCOPE.sCountry('tur_scope').GetName]!"
 balkan_crisis.11.b: "There is too much risk."
 
 balkan_crisis.12.t: "Blood in the Water"
 balkan_crisis.12.d: "[SCOPE.sCountry('tur_scope').GetName]'s decision to disregard the results of the [SCOPE.sCountry('tur_scope').GetCapital.GetCityHubName] Conference has further deteriorated their relations with other European Great Powers. With anti-[SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] sympathies running high throughout Europe due to the [SCOPE.sCulture('crisis_culture').GetName] atrocities and the rejection of the [SCOPE.sCountry('tur_scope').GetCapital.GetCityHubName] agreements, there may no be a better time for us to finally break free from the Turkish yoke."
 balkan_crisis.12.f: ""Your Excellency, I am grateful for the opportunity to meet with you. As you are well aware, the conflict with [SCOPE.sCountry('tur_scope').GetName] has reached a critical juncture, and [SCOPE.sCountry('attacker_scope').GetName] seeks the support of its [ROOT.GetCountry.GetAdjectiveNoFormatting] allies.""
 balkan_crisis.12.a: "[ROOT.GetCountry.GetName] shall join the cause."
 balkan_crisis.12.b: "We will not get involved in [SCOPE.sCountry('attacker_scope').GetName]'s wars."
 will_fight_ottomans: "We will join the [SCOPE.sCountry('attacker_scope').GetAdjectiveNoFormatting]-[SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] War when it happens."
 
 balkan_crisis.13.t: "The Threats of War"
 
 balkans_fail_condition_1_tt: "If the #bold Balkan Crisis#! progress is #red less than#! #variable 120#! when we fail, we will be forced to grant increased autonomy to our Balkan subjects."
 balkans_fail_condition_2_tt: "If the #bold Balkan Crisis#! progress #red reaches#! #variable 120#! when we fail, we will be forced to grant independence to our Balkan subjects."
 
 balkan_crisis_2.3.t: "End of the Balkan Insurgency"
 balkan_crisis_2.3.d: "Through skillful negotiations, modernization, and political reforms, [ROOT.GetCountry.GetName] has managed to avert the worst-case scenario and emerged from the crisis intact. While this may not be the end of political turmoil in the Balkans, we have successfully proven to the world and the greedy vultures that [ROOT.GetCountry.GetName] is perfectly capable of maintaining its own stability and sovereignty."
 balkan_crisis_2.3.f: ""What is tolerance? It is a necessary consequence of humanity. We are all fallible, let us then pardon each other's follies. This is the first principle of natural right."" #Obligatory Voltaire quote
 balkan_crisis_2.3.a: "Praise Allah for His mercy!"
 eternal_porte: "The Eternal Porte"
 balkan_crisis_suppression: "Turmoil Recovery"
 
 balkan_crisis_2.4.t: "The Rumelian Confederation"
 balkan_crisis_2.4.d: "The recent crises has proven that the [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] model of governance, especially in the Balkans, has been a complete failure. Thus, the Great Powers has held a diplomatic conference and came to an agreed conclusion:"
 balkan_crisis_2.4.f: ""In the year of our Lord, we have convened under the auspices of the great powers of Europe, assembled to deliberate upon the matters concerning the Eastern Question, which had arisen from the ongoing strife in the Balkans, and deliberated the following matters:\n\n1. The Congress acknowledged the independence of all Hungarian, Romanian, and Ruthenian states from [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] suzerainty.\n2. The Congress acknowledged the the autonomy of the Balkan states, while still recognizing [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] authority over them under the banner of the #bold Rumelian Confederation#!.\n3. The territorial exchanges between [SCOPE.sCountry('tur_scope').GetName] and other European powers, with the exception of unlawful claims over #bold Constantinople#!, shall be officialized.\n4. In response to concerns regarding the treatment of Christian minorities within [SCOPE.sCountry('tur_scope').GetName], the Congress shall mandate reforms aimed at improving their status and protecting their rights.\n5. International navigation rights shall be established on the Danube River, ensuring free passage and trade along this vital waterway.""
 balkan_crisis_2.4.a: "You have got to be kidding me!"
 balkan_crisis_2.4.b: "Splendid."
 balkan_crisis_fail: "Failed the Balkan Crisis"
 
 balkan_crisis_2.5.t: "The Balkan Liberation"
 balkan_crisis_2.5.d: "The recent crises has proven that the [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] model of governance, especially in the Balkans, has been a complete failure. Thus, the Great Powers has held a diplomatic conference and came to an agreed conclusion:"
 balkan_crisis_2.5.f: ""In the year of our Lord, we have convened under the auspices of the great powers of Europe, assembled to deliberate upon the matters concerning the Eastern Question, which had arisen from the ongoing strife in the Balkans, and deliberated the following matters:\n\n1. The Congress acknowledged the independence of all Hungarian, Romanian, and Ruthenian states from [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] suzerainty.\n2. The Congress acknowledged the the independence of the Balkan states from [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] suzerainty.\n3. The territorial exchanges between [SCOPE.sCountry('tur_scope').GetName] and other European powers, with the exception of unlawful claims over #bold Constantinople#!, shall be officialized.\n4. In response to concerns regarding the treatment of Christian minorities within [SCOPE.sCountry('tur_scope').GetName], the Congress shall mandate reforms aimed at improving their status and protecting their rights.\n5. International navigation rights shall be established on the Danube River, ensuring free passage and trade along this vital waterway.""
 balkan_crisis_2.5.a: "You have got to be kidding me!"
 balkan_crisis_2.5.b: "Splendid."
