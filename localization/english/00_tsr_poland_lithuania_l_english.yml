l_english:
  #Odrodzenie
  je_odrodzenie: "Odrodzenie – Atgimimas"
  je_odrodzenie_reason: "Torn apart between neighbors and passed between one empire's sphere to another, the current [ROOT.GetCountry.GetName] is nothing but a shadow of its former self. Yet, as the winds of nationalism sweeping Europe begun to pass through [ROOT.GetCountry.GetName], figures both within our government and without are now inspired to look towards the restoration of the Polish-Lithuanian state to its former glory.\n\nShould we encourage Polish and Lithuanian rebels to seize a subjugated Polish or Lithuanian state, we will be able to join their state to ours, provided [SCOPE.GetRootScope.GetCountry.GetName] is itself independent."
  polish_radicals_overlord_cooldown_tt: "Has not used the #bold Encourage Polish-Lithuanian Nationalism#! decision in the past #bold three years#!"
  polish_radicals_subject_cooldown_year_tt: "Has not used the #bold Sponsor Pro-Commonwealth Sentiment#! decision in the past #bold three years#!"
  je_odrodzenie_polish_radicals_overlord_button: "Encourage Nationalism"
  je_odrodzenie_polish_radicals_overlord_button_desc: "Across the domains of the old union, countless groups, cells, and committees can be found working to raise arms against their own oppressors. By acting as a safehaven for Polish-Lithuanian patriots, and through the funding and support of their efforts, [SCOPE.GetRootScope.GetCountry.GetName] can prepare the Polish-Lithuanian lands outside our direct control for future liberation."
  je_odrodzenie_polish_radicals_subject_button: "Spur Pro-Commonwealth Sentiment"
  je_odrodzenie_polish_radicals_subject_button_desc: "Throughout the Polish-Lithuanian homelands, the masses are slowly awakening and turning towards the idea of reunifying with the Commonwealth. If their rulers are not inclined to follow the call, perhaps their people will be."
  polish_radicals_overlord_cooldown_tt: "This decision will become available again in #bold three years#!"
  polish_radicals_subject_cooldown_tt: "This decision will become available again in #bold three years#!"
  
  je_odrodzenie_victim: "Odrodzenie – Atgimimas"
  je_odrodzenie_victim_reason: "Torn apart between neighbors and passed between one empire's sphere to another, the current [ROOT.GetCountry.GetName] is nothing but a shadow of its former self. Yet, as the winds of nationalism sweeping Europe begun to pass through [ROOT.GetCountry.GetName], figures both within our government and without are now inspired to look towards the restoration of the Polish-Lithuanian state to its former glory.\n\nWithin our states, we have [Country.MakeScope.Var('polish_states_radicals_total').GetValue|D] radicals out of a total population of [Country.MakeScope.Var('polish_states_pop_total').GetValue|D], representing [Country.MakeScope.Var('polish_states_radicals_total_bar').GetValue|R]#red %#! of our Polish and Lithuanian population.\n\nReaching #red;bold;shadow 25%#! will lead to the seizure of the [ROOT.GetCountry.GetAdjective] government by Polish-Lithuanian revolutionaries and our annexation into [SCOPE.sCountry('poland_scope').GetName]."
  je_odrodzenie_victim_goal: "#red;bold;shadow 25%#! of our Polish or Lithuanian population has become radicalized."
  
  poland_lithuania_events.1.t: "White-and-Reds Over [SCOPE.sState('capital_scope').GetCityHubName]"
  poland_lithuania_events.1.d: "Inspired by the reunification of [SCOPE.sCountry('poland_scope').GetName], nationalist rebels have seized control of [SCOPE.sState('capital_scope').GetCityHubName] and have sworn themselves to [SCOPE.sCharacter('poland_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('poland_ruler_scope').GetFullName] of [SCOPE.sCountry('poland_scope').GetName]."
  poland_lithuania_events.1.f: ""Traitors! Traitors in the midst! Sound the alarm, call for the guards at once!"\n\n"Do you mean the suited men beside me, sir? I should hope so, since you were foolish enough to announce your presence. Now, I shall make this plain, as your raving ineptitude forced our hand in the first place: Poland-Lithuania will rise. It demands a place on the world stage, and it won't be cared for by men of your ill-fitting ilk.""
  poland_lithuania_events.1.a: "We will rise again, as part of a whole."

  poland_lithuania_events.2.t: "Polish-Lithuanian Nationalists Seize [SCOPE.sState('capital_scope').GetCityHubName]"
  poland_lithuania_events.2.d: "Inspired by the unification of [SCOPE.sCountry('poland_scope').GetName], nationalist rebels have seized [SCOPE.sCountry('polish_revolter').GetName] and pledged themselves under the banner of Polish-Lithuanian [SCOPE.sCharacter('poland_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('poland_ruler_scope').GetFullName]."
  poland_lithuania_events.2.f: "The rebirth of Poland-Lithuania has never been far from the lips of the mad and the ambitious alike. Indeed, a splendid reawakening of the empire would give even the single God pause. Such attempts have been folly in the past. Yet in furtive whispers, there is a belief that there may be hope that the Crimson Phoenix will rise again."
  poland_lithuania_events.2.a: "We welcome our brothers and sisters into [SCOPE.sCountry('poland_scope').GetName]."
  poland_lithuania_events.2.b: "[SCOPE.sCountry('polish_revolter').GetName] is free to join our state."
  poland_lithuania_events.2.c1: "We welcome our brothers and sisters into [SCOPE.sCountry('poland_scope').GetName]."
  poland_lithuania_events.2.d1: "[SCOPE.sCountry('polish_revolter').GetName] is free to join our state."
  poland_lithuania_events.2.e: "We cannot risk the ire of our neighbors."
  
  poland_lithuania_events.3.t: "Polish-Lithuanian Nationalists Seize [SCOPE.sState('capital_scope').GetCityHubName]"
  
  poland_lithuania_events.4.t: "Odrodzenie – Atgimimas"
  poland_lithuania_events.4.d: "Under [SCOPE.sCharacter('poland_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('poland_ruler_scope').GetFullName], [SCOPE.sCountry('poland_scope').GetName] has handled its internal crises and unified into a modern nation-state. Now, [SCOPE.sCharacter('poland_ruler_scope').GetFirstNameNoFormatting] wishes to look outwards and announces his grand ambition: igniting a shared Polish-Lithuanian identity and reunifying every parts of the empire that has been unlawfully subjugated centuries prior."
  poland_lithuania_events.4.f1: ""From now on, we do not know any difference between us. We are now brothers, sons of one Motherland, with one father, God in heaven! Let us call upon Him for help, and He will bless our weapons and give us victory!""
  poland_lithuania_events.4.f2: ""No, sir. I am not a foreigner, nor am I an [SCOPE.sCountry('polish_overlord_scope').GetAdjectiveNoFormatting]. I am a Pole, and a Pole in Poland is never a foreigner.""
  poland_lithuania_events.4.f3: ""No, sir. I am not a foreigner, nor am I an [SCOPE.sCountry('polish_overlord_scope').GetAdjectiveNoFormatting]. I am a Lithuanian, and a Lithuanian in Lithuania is never a foreigner.""
  poland_lithuania_events.4.a: "The empire shall be reclaimed!"
  poland_lithuania_events.4.b: "We will not succumb to this!"
  
  #Union of Augustów
  je_union_of_augustow_pol: "Union of Augustów"
  je_union_of_augustow_pol_reason: "For most of our shared history, the Lithuanian nobility were eager to maintain the personal union with [SCOPE.sCountry('pol_scope').GetName], but resisted Polish demands for the incorporation of the Grand Duchy into Poland. This was exemplified by the failure of the #bold Union of Lublin#! in 1569, which was met by vehement rejection from Lithuanian nobles under the basis that Poland had failed to defend their territories from the #bold Grand Duchy of Prussia#! and #bold Tsardom of Russia#!. The failed negotiations marked the decline of the #bold First Polish-Lithuanian Union#!, culminating in its dissolution in 1692 when Lithuania seceded to form a union with #bold Sweden#!.\n\nThe #bold Second Polish-Lithuanian Union#! began in 1790 when, following the end of the Swedish-Lithuanian Union, Grand Duke Karolis II Vasa of Lithuania was elected the King of Poland under the condition of supporting the Polish nobility in the #bold Polish Revolt#! against Prussia. Although tension remained between the two kingdoms over the king's foreign Swedish heritage and Lithuania's "past treachery", the greatly reduced power and territorial extent of both constituent countries has revived talks of a proper unification much like the attempted #bold Union of Lublin#!.\n\nProponents of the proposed #bold Union of Augustów#! argued that a unification is the only way for the Second Union to survive, let alone regain our power. However, if we want to avoid another failure, great amounts of efforts and cooperation with [SCOPE.sCountry('lit_scope').GetName] is needed.\n\nThe #bold Union Progress#! is expected to advance by #tooltippable;tooltip:[Country.GetTooltipTag],je_union_of_augustow_special_tooltip [GetGlobalVariable('plc_point_var_next').GetValue|+=]#! next month"
  je_union_of_augustow_lit: "Union of Augustów"
  je_union_of_augustow_lit_reason: "For most of our shared history, the Lithuanian nobility were eager to maintain the personal union with [SCOPE.sCountry('pol_scope').GetName], but resisted Polish demands for the incorporation of the Grand Duchy into Poland. This was exemplified by the failure of the #bold Union of Lublin#! in 1569, which was met by vehement rejection from Lithuanian nobles under the basis that Poland had failed to defend their territories from the #bold Grand Duchy of Prussia#! and #bold Tsardom of Russia#!. The failed negotiations marked the decline of the #bold First Polish-Lithuanian Union#!, culminating in its dissolution in 1692 when Lithuania seceded to form a union with #bold Sweden#!.\n\nThe #bold Second Polish-Lithuanian Union#! began in 1790 when, following the end of the Swedish-Lithuanian Union, Grand Duke Karolis II Vasa of Lithuania was elected the King of Poland under the condition of supporting the Polish nobility in the #bold Polish Revolt#! against Prussia. Although tension remained between the two kingdoms over the king's foreign Swedish heritage and Lithuania's "past treachery", the greatly reduced power and territorial extent of both constituent countries has revived talks of a proper unification much like the attempted #bold Union of Lublin#!.\n\nProponents of the proposed #bold Union of Augustów#! argued that a unification is the only way for the Second Union to survive, let alone regain our power. However, if we want to avoid another failure, great amounts of efforts and cooperation with [SCOPE.sCountry('pol_scope').GetName] is needed. #bold We may also resist at the cost of aggravating [SCOPE.sCountry('pol_scope').GetName]#!\n\nThe #bold Union Progress#! is expected to advance by #tooltippable;tooltip:[Country.GetTooltipTag],je_union_of_augustow_special_tooltip [GetGlobalVariable('plc_point_var_next').GetValue|+=]#! next month"
  je_union_of_augustow_special_tooltip: "This rate is determined by the following:\n#variable [GetGlobalVariable('plc_point_from_radicals_pol').GetValue|+=]#! from Polish [Concept('concept_state', '$concept_states$')] in [concept_turmoil]\n#variable [GetGlobalVariable('plc_point_from_radicals_lit').GetValue|+=]#! from Lithuanian [Concept('concept_state', '$concept_states$')] in [concept_turmoil]\n#variable [GetGlobalVariable('plc_point_from_loyalists_pol').GetValue|+=]#! from Polish [Concept('concept_state', '$concept_states$')] with [Concept('concept_loyalist','$concept_loyalists$')]\n#variable [GetGlobalVariable('plc_point_from_loyalists_lit').GetValue|+=]#! from Lithuanian [Concept('concept_state', '$concept_states$')] with [Concept('concept_loyalist','$concept_loyalists$')]\n#variable [GetGlobalVariable('plc_point_from_nationalism').GetValue|+=]#! from Poland or Lithuania researching the #v $nationalism$#! [concept_technology]\n#variable [GetGlobalVariable('plc_point_from_pannationalism').GetValue|+=]#! from Poland or Lithuania researching the #v $pan-nationalism$#! [concept_technology]\n#variable [GetGlobalVariable('plc_point_from_positive_relations').GetValue|+=]#! from Lithuania's [concept_attitude] to Poland\n#variable [GetGlobalVariable('plc_point_from_autonomy').GetValue|+=]#! from Lithuania's increased or reduced autonomy\n#variable [GetGlobalVariable('plc_point_from_centralization').GetValue|+=]#! from Polish #bold Centralization#! [Concept('concept_law','$concept_laws$')] and [Concept('concept_institution', '$concept_institutions$')]\n#variable [GetGlobalVariable('plc_point_var_add').GetValue|+=]#! from other effects\n\nOther conditions that will affect our progress:\n• Polish rank of [concept_major_power] (without losing power rank) will increase our progress by #variable #green 10#!#!\n• Polish rank of [concept_great_power] (without losing power rank) will increase our progress by #variable #green 10#!#!\n• Polish or Lithuanian [concept_civil_war] with more than #variable 50%#! progress will decrease our progress by #variable #red 10#!#!\n• Polish [concept_default] or [concept_bankruptcy] will decrease our progress by #variable #red 10#!#!"
  plc_union_fail: "The #bold Progress Bar#! has reached #variable 0%#!"
