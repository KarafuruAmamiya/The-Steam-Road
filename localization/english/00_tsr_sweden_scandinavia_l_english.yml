l_english:
 # Swedish Regency
 je_swe_regency: "The Regency Era"
 je_swe_regency_reason: "Following the untimely passing of King Christian V in June 1826, Queen-Regent [ROOT.GetCountry.GetRuler.GetFullName], at the time only a month away from giving birth to #GOLD Gustav III#!, has become the de facto ruler of the United Kingdoms through the Regency Act. Yet, differing laws and views between the three Scandinavian kingdoms has led to dissatisfactions to the current arrangement given the Queen-Regent's perceived bias towards Sweden and foreign birth. It is necessary that #GOLD Gustav III#! rise to the throne as soon as possible to maintain the union's stability.\n\n#bold As long as we are in the Regency era, we will suffer a penalty to our legitimacy, ability to enact laws, and integrating subjects.#!"
 swe_regency: "Regency Era"
 gustav_come_to_age_tt: "#bold Gustav III#! is our ruler"
 heir_come_to_age_tt: "Our heir has come to age"
 no_gustav_tt: "#bold Gustav III#! is not the heir to the throne"
 no_regency_tt: "We are not in the Regency era"
 gustav_iii_coronation_tt: "[SCOPE.sCharacter('gustav_iii_scope').GetFirstName] rises to the thrones of [SCOPE.sCountry('swe_scope').GetName], [SCOPE.sCountry('den_scope').GetName], and [SCOPE.sCountry('nor_scope').GetName]"
 law_amended_tt: "A succession crisis forces us to amend our succession laws"
 changed_succession_laws: "Changed Succession Laws"
 changed_succession_laws_gustav: "Changed Succession Laws"
 faster_regency_tt: "#bold Gustav III#! will be coronated at 14 years old"
 gustav_iii_coronated_tt: "Our heir already rose to the throne."
 no_gustav_iii_tt: "Our heir is not #bold Gustav III#!"
 
 scandinavian_events.1.t: "End of the Regency Era"
 scandinavian_events.1.d: "King [SCOPE.sCharacter('gustav_iii_scope').GetFirstName]'s coronation took place on [TimeKeeper.GetCurrentDate.GetString] in the #italic Storkyrkan#!. The young king, barely a young adult, ascended the throne with the procession witnessed by subjects all the way from Holstein to Karelen."
 scandinavian_events.1.f: ""The Almighty everlasting God pour out His Holy Spirit into your soul and mind, plans and undertakings, by whose gift may you so rule land and kingdom as to redound to the honour and glory of God, maintain justice and equity and be for the good of the land and people.""
 scandinavian_events.1.a: "Bevare Gud vår kung!"
 scandinavian_events.1.b: "Gud bevare kongen!"
 
 scandinavian_events.2.t: "The Scandinavian Succession"
 scandinavian_events.2.d: "The death of Gustav III has sent shockwaves throughout the empire, and our succession law dictates that Gustav III's uncle and Christian V's younger brother #bold Karl XI#! inherit the throne."
 scandinavian_events.2.f: "#bold Gustav III#! was a well-liked heir, but #bold Karl XI#! is an educated and experienced statesman whose ability to rule an empire is unquestioned. He will certainly bring back stability to the union."
 scandinavian_events.2.a: "Bevare Gud vår kung!"
 
 scandinavian_events.3.t: "An Earlier Coronation?"
 scandinavian_events.3.d: "The unpopularity of Queen-Regent [ROOT.GetCountry.GetRuler.GetFirstName] in [SCOPE.sCountry('den_scope').GetName] and [SCOPE.sCountry('nor_scope').GetName] has led to our advisors, especially Danish and Norwegian ones, to suggest that [SCOPE.sCharacter('gustav_iii_scope').GetFirstName] should ascend to the throne as soon as possible. However, to amend our succession simply because of our subjects' whims will certainly alienate our own nobility."
 scandinavian_events.3.f: ""The Queen-Regent's lack of attention and apparent negligence of [SCOPE.sCountry('den_scope').GetName] and [SCOPE.sCountry('nor_scope').GetName], combined with her reliance on Swedish advisors, have strained our historical ties with the Swedish Crown. It is said that she has little regard for the affairs of any realms but [SCOPE.sCountry('swe_scope').GetName].""
 scandinavian_events.3.a: "[SCOPE.sCharacter('gustav_iii_scope').GetFirstName] will be coronated as soon as possible."
 scandinavian_events.3.b: "The prince is not mature enough yet!"
 
 #Scandinavian Union
 je_scandinavian_union_main: "Scandinavian Union"
 je_scandinavian_union_main_reason: "Throughout our history, the union of Scandinavian nations had been a long-standing one, starting with the Kalmar Union in 1397, followed by the Swedish-Norwegian union in 1482, and the Swedish-Danish union in 1711. However, the three kingdoms had always remained separate entities, and previous attempts to establish a single unified state had always been met with opposition from one or more of its constituents. Now, as the idea of Scandinavianism began to spread and became accepted among the Swedish nobility, we are arguably closer than we ever were to a unified Scandinavia — provided they could convince their Danish and Norwegian counterparts of the same."
 not_in_regency_tt: "To begin our unification efforts, we must not be in the #bold Regency Era#!"
 je_scandinavian_union_subject: "The Scandinavian Union"
 je_scandinavian_union_subject_reason: "Throughout our history, the union of Scandinavian nations had been a long-standing one, starting with the Kalmar Union in 1397, followed by the Swedish-Norwegian union in 1482, and the Swedish-Danish union in 1711. However, the three kingdoms had always remained separate entities, and previous attempts to establish a single unified state had always been met with opposition from one or more of its constituents. Now, as the idea of Scandinavianism began to spread and became accepted among the Swedish nobility, we are arguably closer than we ever were to a unified Scandinavia — provided they could convince their Danish and Norwegian counterparts of the same."
 je_scandinavian_union_status: "Danish Union Progress: #tooltippable;tooltip:[ROOT.GetCountry.GetTooltipTag],je_scandinavian_union_tooltip [GetGlobalVariable('denmark_point').GetValue|0]#!\nNorwegian Union Progress: #tooltippable;tooltip:[ROOT.GetCountry.GetTooltipTag],je_scandinavian_union_tooltip [GetGlobalVariable('norway_point').GetValue|0]#!"
 je_scandinavian_union_tooltip: "#tooltip_header Conditions that can #bold decrease#! the Union Progress:#!\n$TOOLTIP_DELIMITER$\n• Sweden losing [concept_great_power] rank\n• Sweden having less than #variable 25#! [concept_legitimacy]\n• Swedish [concept_civil_war] progress more than #variable 50%#!\n• Sweden in [concept_default] or having declared [concept_bankruptcy]\n• Denmark or Norway's #red rebellious#! [concept_attitude]\n• Denmark or Norway having a [concept_revolution]"
 denmark_appeased_tt: "We have taken the #bold Integrate Denmark#! decision"
 norway_appeased_tt: "We have taken the #bold Integrate Norway#! decision"
 denmark_martial_law_tt: "We have enforced Martial Law in Denmark"
 norway_martial_law_tt: "We have enforced Martial Law in Norway"
 denmark_loyalty_attitude_tt: "Denmark is #bold #green Loyal#!#! towards us and is a [concept_real_union] or [concept_dependency]-type [concept_subject]"
 norway_loyalty_attitude_tt: "Norway is #bold #green Loyal#!#! towards us and is a [concept_real_union] or [concept_dependency]-type [concept_subject]"
 denmark_radicals_tt: "No Danish [concept_homeland] has more than #variable 25%#! radicals"
 norway_radicals_tt: "No Norwegian [concept_homeland] has more than #variable 25%#! radicals"
 denmark_point_10: "The Danish Union Progress has reached #variable 10#!"
 norway_point_10: "The Norwegian Union Progress has reached #variable 10#!"
 denmark_point_0: "The Danish Union Progress has reached #variable 0#!"
 norway_point_0: "The Norwegian Union Progress has reached #variable 0#!"
 nobles_appeased_tt: "Sweden has convinced our government to support the union. #red This will lead to our annexation#!"
 add_denmark_point: "Danish Union Progress increases by #variable 1#!"
 add_norway_point: "Norwegian Union Progress increases by #variable 1#!"
 remove_denmark_point: "Danish Union Progress decreases by #variable 1#!"
 remove_norway_point: "Norwegian Union Progress decreases by #variable 1#!"
 
 scandinavian_union_denmark_button: "Integrate Denmark"
 scandinavian_union_denmark_button_desc: "Once we have handled all the #bold Matter of Denmark#!, we can convince the Danes to support the union."
 scandinavian_union_norway_button: "Integrate Norway"
 scandinavian_union_norway_button_desc: "Once we have handled all the #bold Matter of Norway#!, we can convince the Norwegians to support the union."
 
 je_scandinavian_union_denmark: "Scandinavian Union: Matter of Denmark"
 je_scandinavian_union_denmark_reason: "Our union with [SCOPE.sCountry('den_scope').GetName] had begun in the 18th century following the War of Danish Succession. Although the Danish nobility accepted our rule to gain access to our colonial markets, tensions remain due to our historical differences. If we hope to have the Danes accept the union, we must find a way to reconcile our religious and citizenship policies."
 scandinavian_union_denmark_religion_button: "The Matter of Religion"
 scandinavian_union_denmark_religion_button_desc: "The differences between the Protestant Danes and the Catholic Swedes have always been a sore point when it comes to enforcing the union. If we wish to unite with Denmark, we must either compromise our religious policies or make them adopt a less hardline stance."
 scandinavian_union_denmark_andersen_button: "Promote Pan-Scandinavianism"
 scandinavian_union_denmark_andersen_button_desc: "There are notable Danish public figures who support the union. Promoting them will help us earn the support of the Danish public."
 andersen_agitate_5_years: "A pan-Scandinavian figure has promoted the union in Denmark for at least 5 years"
 scandinavian_union_denmark_citizenship_button: "The Matter of Citizenship"
 scandinavian_union_denmark_citizenship_button_desc: "Denmark's exclusionary policies against German citizens has made them wary of the increased the status of Germans if they were to unite with us. We must reach a compromise between our citizenship laws."
 scandinavian_union_denmark_nationalist_button: "Handle Danish Nationalism"
 scandinavian_union_denmark_nationalist_button_desc: "The rise of Danish nationalism also led to increased separatism and rejection of the union. We must either reach a compromise, or suppress them by force."
 scandinavian_union_denmark_bribe_button: "Bribe Danish Voters"
 scandinavian_union_denmark_bribe_button_desc: "When all else fails, a good paycheck will turn the opinion of even the most hardline anti-unionist."
 scandinavian_union_denmark_martial_law_button: "Enforce Martial Law"
 scandinavian_union_denmark_martial_law_button_desc: "Anti-Union resistance have taken hold of the Danes. By declaring martial law in Denmark, we can suppress them with a display of force."
 imposing_martial_law: "Imposing Martial Law"
 martial_law: "Martial Law Enforced"
 
 je_scandinavian_union_norway: "Scandinavian Union: Matter of Norway"
 je_scandinavian_union_norway_reason: "Our union with [SCOPE.sCountry('nor_scope').GetName] had been a long-standing one, beginning with the rebellion of Norwegian and Swedish nobles against the Kalmar Union in 1482. However, our laws have always diverged from one another, especially with the adoption of constitution in [SCOPE.sCountry('nor_scope').GetName] and their protests against our protectionist trade policies. Our loss of control over [SCOPE.sCountry('krl_scope').GetName], originally a Norwegian colony, have not helped matter. We must reconcile these differences if we hope to have the Norwegians accept the union."
 scandinavian_union_norway_democracy_button: "The Matter of Constitution"
 scandinavian_union_norway_democracy_button_desc: "Norway's democratic constitution is the second-oldest in the world, right after the Constitution of the Italian Republic — and they are unwilling to give it up. We must reconcile the differences between our governance."
 scandinavian_union_norway_vinland_button: "The Matter of Vinland"
 scandinavian_union_norway_vinland_button_desc: "The loss of control over Vinland and Greenland have led to widespread outrage among the Norwegians, causing them to doubt our capabilities. We must amend these failures to regain their trust."
 scandinavian_union_norway_trade_button: "The Matter of Trade"
 scandinavian_union_norway_trade_button_desc: "Norway has historically embraced free trade as a linchpin of their economy, and they are reluctant to adopt our protectionist policies. We must reach an agreement in trading policies before proceeding with the union."
 scandinavian_union_norway_nationalist_button: "Handle Norwegian Nationalism"
 scandinavian_union_norway_nationalist_button_desc: "The rise of Norwegian nationalism also led to increased separatism and rejection of the union. We must either reach a compromise, or suppress them by force."
 scandinavian_union_norway_bribe_button: "Bribe Norwegian Voters"
 scandinavian_union_norway_bribe_button_desc: "When all else fails, a good paycheck will turn the opinion of even the most hardline anti-unionist."
 scandinavian_union_norway_martial_law_button: "Enforce Martial Law"
 scandinavian_union_norway_martial_law_button_desc: "Anti-Union resistance have taken hold of the Norwegians. By declaring martial law in Norway, we can suppress them with a display of force."
 
 scandinavian_events.4.t: "Scandinavian Unification"
 scandinavian_events.4.d: ""
 scandinavian_events.4.f: ""
 scandinavian_events.4.a: ""
 
 scandinavian_events.5.t: "[SCOPE.sCharacter('andersen_scope').GetFullName]"
 scandinavian_events.5.d: "[SCOPE.sCharacter('andersen_scope').GetFullName] is a profilic Danish writer best known for his literary fairy tales. Recently, he has shown his support for the unification of Scandinavia, and he will certainly do us well in promoting our unification efforts in Denmark."
 scandinavian_events.5.f: ""We are one people, we are called Scandinavians,\nIn three realms our homeland is divided;\nBut between the great heavenly gifts\nIt lies: our heart grows into one\nLet it be forgotten, if wrong was done unto us;\nThe spirit of time, like a cleansed Margarethe,\nUnites us, it gives thrice the power,\nEven the language unites us\nOn mountains, in woods and by the night-blue sea,\nI shout with joy: I am a Scandinavian!""
 scandinavian_events.5.a: "Let's commission him."
 promoting_pan_scandinavianism: "Promoting Pan-Scandinavianism"