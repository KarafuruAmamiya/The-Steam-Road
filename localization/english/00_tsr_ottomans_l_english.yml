  ottoman_flavor.7.t: "Triumph of [ROOT.GetCountry.GetRuler.GetFirstName]'s Faction"
  ottoman_flavor.7.d: "As expected of Allah's chosen ruler, [ROOT.GetCountry.GetRuler.GetFirstName] and his loyal supporters have dealt the final blow to the Westernist Faction led by [SCOPE.sCharacter('mehmed_scope').GetFirstName]. With the remaining supporters of the faction scattered, they will no longer pose a threat to our reign."
  ottoman_flavor.7.f: "The Pretender's tyranny has finally been crushed. Like all those who oppose us, and much like the fate of his predecessor #bold Orhan II#!, he and his followers shall be purged for the sins they committed against the rightful Sultan."
  ottoman_flavor.7.a: "We have emerged victorious once more"
  westernist_defeated: "Victory Over the Westernists"
  
  ottoman_flavor.8.t: "The Restoration of [SCOPE.sCharacter('mehmed_scope').GetFirstName]"
  ottoman_flavor.8.d: "Through a combination of popular support and decisive victories against the Old Order, the rightful Sultan [SCOPE.sCharacter('mehmed_scope').GetFirstName] has reclaimed the [ROOT.GetCountry.GetAdjectiveNoFormatting] throne. The old powers has been suppressed, and they will not see a return to relevance for a long time."
  ottoman_flavor.8.f: "Allah is fair indeed. #bold Orhan II#! has been avenged, and [SCOPE.sCharacter('mehmed_scope').GetFirstName] does not waste any time before enacting many of his promised reforms as his late father envisioned. A new era shall rise in [ROOT.GetCountry.GetName], one where enlightenment and progress lead the way."
  ottoman_flavor.8.a: "Justice has prevailed once more"
  westernist_takeover_positive: "Westernist Takeover"
  westernist_takeover_negative: "Westernist Takeover"
  
  ottoman_flavor.9.t: "Suppressing Westernist Activities"
  ottoman_flavor.9.d: "The increasing unrest in certain provinces caused by the Westernist faction's agitations has been of great concern to the Porte. They have left us with no choice but to use the harshest methods to restore order and safeguard the safety of our people."
  ottoman_flavor.9.f: "Orders has been issued from the central authority of [ROOT.GetCountry.GetCapital.GetCityHubName], where the Valis of the following vilayets shall be granted permission to use the most effective methods in suppressing Westernist activity:"
  ottoman_flavor.9.a: "[SCOPE.sState('pro_mehmed_state_1').GetName] must take priority"
  ottoman_flavor.9.b: "[SCOPE.sState('pro_mehmed_state_2').GetName] requires our attention"
  ottoman_flavor.9.c: "Order shall be restored to [SCOPE.sState('pro_mehmed_state_3').GetName]"
  
  ottoman_flavor.11.t: "Westernist Coup in [SCOPE.sCountry('tur_scope').GetName]"
  ottoman_flavor.11.d: "Our support of the Westernist faction in [SCOPE.sCountry('tur_scope').GetName] has yielded results. [SCOPE.sCharacter('mehmed_scope').GetFirstName] has risen to the [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] throne, and now we must choose whether to continue supporting his regime or withdraw support."
  ottoman_flavor.11.f: ""Allah is fair indeed. #bold Orhan II#! has been avenged, and [SCOPE.sCharacter('mehmed_scope').GetFirstName] does not waste any time before enacting many of his promised reforms as his late father envisioned. A new era shall rise in [SCOPE.sCountry('tur_scope').GetName], one where enlightenment and progress lead the way.""
  ottoman_flavor.11.a: "The new Ottoman regime is our ally."
  ottoman_flavor.11.b: "Our goal has been achieved, what happens next is of little concern to us."
  
  notification_westernist_state_defection_name: "Westernist Faction gains support in [SCOPE.sState('mehmed_defector_state').GetName]"
  notification_westernist_state_defection_desc: "The Westernist Faction has gained significant traction in [SCOPE.sState('mehmed_defector_state').GetName]"
  
  #Veiled Puppet
  je_veiled_puppet: "Veiled Puppet"
  je_veiled_puppet_reason: "For most of its existence, the [SCOPE.sCountry('akn_scope').GetName] has remained under Persian influence. Although they had gained power and influence on their own through their victories in the #bold Gunpowder Wars#!, they failed to maintain their newfound power for long and are now slowly eroded back into [SCOPE.sCountry('per_scope').GetName]. The Treaty of Baglar and blatant Persian enroachment into Akkovin politics only strengthen our suspicions. If we wish to prevent Persian enroachment into Anatolia, we cannot let the Akturk lands fall under Persian dominance, even by force."
  
  treaty_of_baglar_events.4.t: "The Veiled Puppet"
  treaty_of_baglar_events.4.d: "The renewing of the treaty between [SCOPE.sCountry('per_scope').GetName] and [SCOPE.sCountry('akn_scope').GetName] has caused major concerns in the Porte. For long, we have tried to maintain peaceful relations with [SCOPE.sCountry('per_scope').GetName], owing to our shared wars and struggles against Europeans in the past. However, they give us no choice but to act if they continue to enroach upon our realm."
  treaty_of_baglar_events.4.f: "Whispers of blood is spreading among the former Gunpowder Alliance — the [SCOPE.sCountry('akn_scope').GetName] who desperately tries to hold onto power, the [SCOPE.sCountry('per_scope').GetName] who tries to cover their internal fractures with military glory, and the [ROOT.GetCountry.GetName] who tries to avoid succumbing to weakness and decline of the First Empire, at all cost."
  treaty_of_baglar_events.4.a: "Send an ultimatum to [SCOPE.sCountry('per_scope').GetName]."
  
  treaty_of_baglar_events.5.t: "[SCOPE.sCountry('tur_scope').GetName] Opposes the Treaty of Baglar"
  treaty_of_baglar_events.5.d: "Our recent pact with [SCOPE.sCountry('akn_scope').GetName] seems to have threatened our paranoid former [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] allies. If we continue to sway [SCOPE.sCountry('akn_scope').GetName] into our influence, our relations with [SCOPE.sCountry('tur_scope').GetName] will certainly deteriorate."
  treaty_of_baglar_events.5.f: ""It is with heavy hearts and righteous indignation that we must expose the treacherous machinations of our erstwhile allies, the perfidious [ROOT.GetCountry.GetName]. Under the guise of friendship and cooperation, they have concocted a sinister plot to exploit our [SCOPE.sCulture('akturk_scope').GetName] brethren and subjugate them to their insatiable thirst for power and profit.""
  treaty_of_baglar_events.5.a: "We simply want to protect our [SCOPE.sCulture('akturk_scope').GetName] brethren from #italic them#!!"
  treaty_of_baglar_events.5.b: "Maintaining peace is more crucial."
  gunpowder_alliance_disband_tt: "The Gunpowder Alliance formally disbands"
  no_bullying_akkovins_tt: "We will not receive more opportunities to exercise authority over the Akkovins."
  
  treaty_of_baglar_events.6.t: "The End of Status Quo"
  treaty_of_baglar_events.6.d: "With Eastern Anatolia and [SCOPE.sCountry('akn_scope').GetName] within our rule, we have successfully secured Akturkistan from further Persian enroachment, and are now looking forward to an integration with our [SCOPE.sCulture('akturk_scope').GetName] brethren. May this send a message for those who dares to undermine the authority of the Sublime Porte."
  treaty_of_baglar_events.6.f: "The Gunpowder Alliance is now merely history, and the two remaining Gunpowder Empires now feel nothing but antagonism and loathing towards each other. Surrounded by enemies from all sides, but having reclaimed all of Anatolia, what will the future of [SCOPE.sCountry('tur_scope').GetName] be like?"
  treaty_of_baglar_events.6.a: "None can deny the power of [SCOPE.sCountry('tur_scope').GetName]"
  
  treaty_of_baglar_events.7.t: "Fall of Akturkistan"
  treaty_of_baglar_events.7.d: "[SCOPE.sCountry('akn_overlord_country').GetName] has secured dominion over [SCOPE.sCountry('akn_scope').GetName]. This state of affairs is quickly becoming known as the Veiled Puppet, for by a technicality [SCOPE.sCountry('akn_scope').GetName] remains legally autonomous, while the [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] Sultan could only helplessly observe the situation."
  treaty_of_baglar_events.7.f: "Today, Diyarbakir was inundated with blood. Those who opposed the new regime were quickly put down. [SCOPE.sCountry('akn_overlord_country').GetAdjectiveNoFormatting] diplomats and politicians have fire in their eyes as they discuss, under the shadow of Karaca Dağ, how they will bring their civilization to the lands of Akturkistan."
  treaty_of_baglar_events.7.a: "Damn them!"
  
  #Turkish Nationalism
  je_turkish_nationalism_main: "The Nationalist Movement"
  je_turkish_nationalism_main_goal: "We have either completed the Nationalist factions' agenda or suppress them for more than 5 years."
  je_turkish_nationalism_trigger_tt_1: "Each of the following has been true for more than 5 years:\n• [SCOPE.GetRootScope.GetCountry.GetName] has enacted [GetLawType('law_presidential_republic').GetName], [GetLawType('law_parliamentary_republic').GetName], or [GetLawType('law_monarchy').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetName] has enacted [GetLawType('law_ethnostate').GetName] or [GetLawType('law_national_supremacy').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetName] has enacted [GetLawType('law_public_schools').GetName] or [GetLawType('law_private_schools').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetName] has enacted [GetLawType('law_freedom_of_conscience').GetName], [GetLawType('law_shared_roots').GetName], or [GetLawType('law_total_separation').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetName] has enacted [GetLawType('law_census_voting').GetName] or [GetLawType('law_universal_suffrage').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetName] has enacted [GetLawType('law_unitary').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetName] has enacted [GetLawType('law_slavery_banned').GetName]\n• Any [concept_interest_group] in government has $ideology_turkish_nationalist$ or $ideology_radical$ leader or agitator"
  je_turkish_nationalism_trigger_tt_2: "Each of the following has been true for more than 5 years:\n• [SCOPE.GetRootScope.GetCountry.GetName] has enacted [GetLawType('law_outlawed_dissent').GetName] or [GetLawType('law_censorship').GetName]\n• Every interest group with $ideology_turkish_nationalist$ or $ideology_radical$ leader or agitator has been marginalized"
  je_turkish_nationalism_main_reason: "The winds of change has begun sweeping through the [SCOPE.GetRootScope.GetCountry.GetName]. The #bold Civil War of 1689#! and subsequent periods of Westernization had already eroded a central pillar of the empire's traditional power structure, opening the path to a period of great upheaval within our empire.\n\nThe spread of liberal ideas and movements across Europe resonated with certain segments of the Ottoman population, particularly among Turkish intellectuals and reformists. Disillusioned with the monarchy and advocating for the establishment of a Turkish nation-state, the movement attracted a growing number of followers who were increasingly frustrated with the perceived ineffectiveness and corruption of the imperial government.\n\n#bold Should we fail to comply with the Nationalists' demands or marginalize them, the Nationalist factions may attempt to instigate a revolution against the current regime.#!"
  turkish_nationalism_agenda_progressing: "The Nationalist agenda is being enacted"
  turkish_nationalism_agenda_repressed: "The Nationalist agenda is being suppressed"
  turkish_nationalism_agenda_none: "No action has been taken with or against the Nationalists"
  
  je_turkish_revolution: "Turkish Revolution"
  je_turkish_revolution_reason: "The #bold National Union#!, a diverse group of intellectuals, military officers, and bureaucrats disillusioned with the ruling regime, has risen to bring about change within [SCOPE.GetRootScope.GetCountry.GetName]. With every passing day, they gather more and more support from the Muslim and Turkish populace, spreading words of dissent all over the empire. If we do not suppress them, we may risk a takeover of our government, or worse, a full-blown civil war.\n\nIf the progress of the Revolution reaches #bold 0#!, our forces will be able to repress it, but if its progress reaches #bold 100#! the revolutionaries shall seize control of the Sublime Porte. The progress of the #bold Turkish Revolution#! is changing by #tooltippable;tooltip:[Country.GetTooltipTag],je_turkish_revolution_drift_special_tooltip [Country.MakeScope.Var( 'turkish_revolution_drift_final_var' ).GetValue]#! every month."
  je_turkish_revolution_goal: "#red #bold Endure the revolutionary movement for 10 years#!#!\nThe following must be true for 10 years:"
  turkish_revolution_not_progressing: "The Revolution is subdued"
  turkish_revolution_progressing: "The Revolution is progressing"
  turkish_revolution_complete: "The Revolution has been placated"
  
  turkish_nationalism.1.t: "The Spread of Turkish Nationalism"
  turkish_nationalism.1.d: "Initially appearing as a fringe group with radical ideals, the [SCOPE.GetRootScope.GetCountry.GetName]'s efforts to modernize and westernize stirred nationalist sentiments among Turkish intellectuals and elites who perceived a threat to their cultural identity and autonomy. Influenced by the principles of liberalism and nationalism, [SCOPE.sCharacter('nationalist_scope').GetFullName] called for the creation of a constitutional and secular Turkish nation-state."
  turkish_nationalism.1.f: ""No longer shall we bow before the whims of distant rulers who care naught for our aspirations and dreams. No longer shall we we languish under the shadow of a decaying empire. Long live Turkey! Long live the Turkish nation! Long live freedom and democracy!""
  turkish_nationalism.1.a: "Perhaps they have a point."
  turkish_nationalism.1.b: "Ridiculous! Root them out at once."
  spreading_nationalist_sentiments: "Spreading Nationalist Sentiments"
  popular_nationalist: "Popular Nationalist Figure"
  nationalists_suppressed: "Suppressed Nationalist Sentiments"
  less_popular_nationalist_red: "Nationalist Figure Suppressed"
  modifier_tur_nationalism: "Nationalist Unrest"
  modifier_tur_nationalism_2: "Nationalist Unrest"
  
  turkish_nationalism.2.t: "A Turkish Empire"
  
  turkish_nationalism.3.t: "Nationalists Suppressed, For Now"
  
  turkish_nationalism.4.t: "The National Union"
  turkish_nationalism.4.d: "Disappointed by the slow pace of reforms and autocratic rule within the [SCOPE.GetRootScope.GetCountry.GetName], radical nationalists and disgruntled members of the military have begun taking matter into their own hands. Their rapid organization into revolutionary groups under the banner of #bold National Union#! has caused alarm within our ranks. Unless we deal with them swiftly, they will pose a major threat to our grip of the empire."
  turkish_nationalism.4.f: ""The time for complacency and submission has passed. No longer shall we bow before foreign masters or kowtow to the whims of despotic rulers. Let the cry of liberty echo through the streets of [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName], Ankara, and every village and town from east to west. Özgürlük, Eşitlik, Kardeşlik!""
  turkish_nationalism.4.a: "This madness must end!"
  
  turkish_nationalism.5.t: "End of the National Union"
  
  turkish_nationalism.6.t: "Triumph of [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]"
  turkish_nationalism.6.d: "Revolutionary forces across the empire have marched and joined together near [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]. Under pressure of being deposed, [ROOT.GetCountry.GetRuler.GetFirstName] issued the #italic İrade-i Hürriyet#!, giving in to the Revolutionaries' demands and calling an election to great jubilation.\n\nThus, today mark the day when the centuries-long absolute rule of the Ottoman Sultanate and the court ceased to be."
  turkish_nationalism.6.f: ""Long live the motherland!\nLong live liberty, equality, and fraternity!\nLong live the Turkish nation!""
  turkish_nationalism.6.a: "Yaşasın devrim!"
  nationalists_seize_power_tt: "The Nationalists will seize control over the #bold Sublime Porte#!, upheaving our government and laws."
  
  je_turkish_revolutionary_war: "Turkish Revolutionary War"
  je_turkish_revolutionary_war_reason: "The National Union has taken over parts of the empire. We must retake control of the state at all costs!"
  
