 latin_republic.5.a: "A new era for the Balkans and beyond!"
 
 notification_ita_latin_republic_notification_name: "Italian Expansionism on the Rise"
 notification_ita_latin_republic_notification_desc: "[SCOPE.sCountry('ita_scope').GetName] has announced its intentions to 'liberate' Balkan and Greek territories, setting them on an imminent conflict with nearby powers."
