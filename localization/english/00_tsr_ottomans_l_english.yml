l_english:
  #Ottoman Caliphate
  je_ottoman_caliphate: "The Ottoman Caliphate"
  je_ottoman_caliphate_reason: "Ever since the fall of the #bold Mamluk Sultanate#!, the authority over the Holy Cities has largely been held by the [SCOPE.sCountry('akn_scope').GetName], whose Sultans proclaimed themselves the Caliph, becoming the de facto leaders and representative of the Islamic world. For long, we held the belief that having the glorious Holy Cities fall under the incompetent rule of the Akkoyunlu Dynasty is nothing short of a travesty. Now that [SCOPE.sCountry('akn_scope').GetName] has shown signs of decline, it is time for a Muslim empire of actual Great Power stature to restore the glory of the Caliphate and Islam."
  pursue_ottoman_caliphate_button: "Claim Caliphal Authority"
  pursue_ottoman_caliphate_button_desc: "With the Holy Cities under our rule, it is time to proclaim ourselves as a Caliphate and assert our authority over Arabia."
  gain_claim_on_arabia_tt: "Gain claims over the Arabic region"
  middle_east_crisis_tt: "Other Middle Eastern countries will view this as a major sign of aggression"
  pursuing_the_caliphate: "Asserting the Caliphate"
  owns_all_arabia_states: "We control all states in the Arabic region directly"
  claimed_caliphal_authority_tt: "We have taken the 'Claim Caliphal Authority' decision"
  westernist_coup_tt: "The Westernist Faction has overthrown our government"
  nationalists_has_taken_over_tt: "The Nationalist Faction has overthrown our government"
  rumelian_confederation_tt: "The Rumelian Confederation has been enforced"
  one_true_caliphate: "The New Caliphate"
  
  ottoman_flavor.1.t: "The Ottoman Caliphate"
  ottoman_flavor.1.d: "The Holy Cities of Mecca and Medina has been successfully reclaimed by us. Sultan of the [SCOPE.sCountry('akn_scope').GetName], [SCOPE.sCharacter('akkovin_sultan').GetFirstName] has formally surrendered the title of caliph to [ROOT.GetCountry.GetRuler.GetFirstName], establishing the Ottoman dynasty as the new caliphal line. Now, it is time to assert our authority as the leader of the Muslim world."
  ottoman_flavor.1.f: ""Allah had promised to those among you who believe and do good works that He will surely make them Successors in the earth, as He made Successors from among those who were before them; and that He will surely establish for them their religion which He has chosen for them; and that He will surely give them in exchange security and peace after their fear: They will worship Me, and they will not associate anything with Me. Then who so is ungrateful after that, they will be the rebellious."" #Surah An-Nur, 24:55
  ottoman_flavor.1.a: "Allah is the one who guides to victory."

  ottoman_flavor.2.t: "The Prophet's Legacy"
  ottoman_flavor.2.d: "With Arabia consolidated, the cradle of Islam is now part of the benevolent rule of [ROOT.GetCountry.GetRuler.GetFirstName], Caliph, Amir al-Mu'minin, and Custodian of the Two Holy Mosques. From this day forward, let us recreate the ancient glory of the Four Caliphs and the Islamic Golden Age."
  ottoman_flavor.2.f: ""The earth belongs to the Loving Divine, who allots it to whomever He wills; yet the most lasting legacy will be the enduring impact of those who have action-based hope.""
  ottoman_flavor.2.a: "Glory to [ROOT.GetCountry.GetName]!"
  
  #Westernist Coalition
  ideology_caliphatist: "Caliphatist"
  ideology_caliphatist_desc: "#lore This leader wants to or wants their ruler to claim the title of a Caliph, uniting the Muslim ummahs under their banner.#!"
  ideology_westernist: "Westernist"
  ideology_westernist_desc: "#lore This leader wants a complete Westernization and radical transformation of the empire, including the modernization of all economic and social institution.#!"
  ideology_turkish_nationalist: "Turkish Nationalist"
  ideology_turkish_nationalist_desc: "#lore This leader demands the creation of a democratic and modernized Turkish nation-state.#!"
  
  je_westernist_coalition: "Westernist Coalition"
  je_westernist_coalition_reason: "During the #bold First Ottoman Empire#! period, the [ROOT.GetCountry.GetName] was almost completely isolated from developments outside its own sphere, believing in its own superiority over anything outsiders could possibly produce. This was violently broken down following the devastating loss in the #bold Third Mamluk-Ottoman War#! which led to a decline of the First Empire and the resulting European enroachment. With the #bold Ottoman Civil War of 1689#! that marked the end of the First Ottoman Empire and the disbandment of the Janissaries, the gradual adoption of European military and administrative reforms, and the #bold Gunpowder Wars#! — a period of constant warfare against European powers, the influence of Western civilization within our empire has become deeply entrenched.\n\nThe current #bold Second Ottoman Empire#! period has seen further upheavals. Sultan #bold Orhan II#! undertook the #italic nizam-ı cedid#! beginning in the late 18th century that modernized the Ottoman Army into a professional standing army. His ambitions didn't stop at the military however, as he envisioned a complete Westernization of the Old Order. His radical vision led to numerous oppositions, culminating in his deposition by a conservative coalition led by his brother #bold Selim III#!. Orhan II was executed under Selim III's orders, but his son [SCOPE.sCharacter('mehmed_scope').GetFirstName] was safely kept hidden, and a reformist coalition has gathered to reclaim [SCOPE.sCharacter('mehmed_scope').GetFirstName]'s rightful place in the throne and continue the #italic nizam-ı cedid#!.\n\nOnce the progress bar is filled, the Westernists will launch a coup to put [SCOPE.sCharacter('mehmed_scope').GetFirstName] on the throne. #bold Westernist Progress#! is expected to advance by #tooltippable;tooltip:[Country.GetTooltipTag],je_westernist_coalition_special_tooltip [Country.MakeScope.Var('westernist_progress_var_next').GetValue|-=]#! next month"
  je_westernist_coalition_special_tooltip: "This rate is determined by the following:\n#variable [Country.MakeScope.Var('westernist_progress_from_radicals').GetValue|-=]#! from Turkish [Concept('concept_state', '$concept_states$')] in [concept_turmoil]\n#variable [Country.MakeScope.Var('westernist_progress_from_characters').GetValue|-=]#! from the combined [concept_popularity] of Westernist characters\n#variable [Country.MakeScope.Var('westernist_progress_from_igs').GetValue|-=]#! from [concept_clout] of Westernist [Concept('concept_interest_group', '$concept_interest_groups$')]\n#variable [Country.MakeScope.Var('westernist_progress_from_domain').GetValue|-=]#! from [Concept('concept_state', '$concept_states$')] with #bold Mehmed IV Support#!\n#variable [Country.MakeScope.Var('westernist_progress_from_legitimacy').GetValue|-=]#! from [concept_government] [concept_legitimacy]\n#variable [Country.MakeScope.Var('westernist_progress_from_loyalists').GetValue|-=]#! from Turkish [Concept('concept_state', '$concept_states$')] with [Concept('concept_loyalist','$concept_loyalists$')]\n#variable [Country.MakeScope.Var('westernist_progress_from_laws').GetValue|-=]#! from #bold Free Speech#! and #bold Home Affairs#! [Concept('concept_law','$concept_laws$')] and [Concept('concept_institution', '$concept_institutions$')]\n#variable [Country.MakeScope.Var('westernist_progress_from_foreign_support').GetValue|-=]#! from 'Support Westernists' and 'Oppose Westernists' [concept_diplomatic_action] from other countries\n#variable [Country.MakeScope.Var('westernist_progress_var_add').GetValue|-=]#! from other effects"
  finished_ottoman_caliphate_je: "We have completed 'The Ottoman Caliphate' [concept_journal_entry]"
  westernist_progress_zero: "The #bold Progress Bar#! has reached #variable 0%#!"
  westernist_progress_full: "The #bold Progress Bar#! has reached #variable 100%#!"
