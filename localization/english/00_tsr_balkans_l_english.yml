 balkan_crisis_deescalate_france: "Cyprus Convention"
 balkan_crisis_deescalate_france_desc: "The weakening of the Ottoman Empire may have unintended effects on the balance of power in Europe and our own influence in the Middle East. We need to secure a beneficial treaty that both ensure the continued survival of the Ottoman Empire while furthering our interests."
 cyprus_convention_tt: "We will offer a secret pact with the Ottomans in which we will be allowed to occupy the strategically-placed island of Cyprus in return for our support against future aggression."
 balkan_crisis_deescalate_england: "Crete Convention"
 balkan_crisis_deescalate_england_desc: "The weakening of the Ottoman Empire may have unintended effects on the balance of power in Europe and our own influence in the Middle East. We need to secure a beneficial treaty that both ensure the continued survival of the Ottoman Empire while furthering our interests."
 crete_convention_tt: "We will offer a secret pact with the Ottomans in which we will be allowed to occupy the strategically-placed island of Crete in return for our support against future aggression."
 balkan_crisis_deescalate_sweden: "Crimea Convention"
 balkan_crisis_deescalate_sweden_desc: "The weakening of the Ottoman Empire may have unintended effects on the balance of power in Europe and our own influence in the Middle East. We need to secure a beneficial treaty that both ensure the continued survival of the Ottoman Empire while furthering our interests."
 crimea_convention_tt: "We will offer a secret pact with the Ottomans in which we will be allowed to occupy the strategically-placed province of Crimea in return for our support against future aggression."
 balkan_crisis_deescalate_iberia: "Algeria Convention"
 balkan_crisis_deescalate_iberia_desc: "The weakening of the Ottoman Empire may have unintended effects on the balance of power in Europe and our own influence in the Middle East. We need to secure a beneficial treaty that both ensure the continued survival of the Ottoman Empire while furthering our interests."
 algiers_convention_tt: "We will offer a secret pact with the Ottomans in which we will be allowed to occupy the strategically-placed Algerian protectorate in return for our support against future aggression."
 balkan_crisis_freeze_tt: "There will be #bold 1 month#! until the treaty is completely ratified."
 balkan_crisis_escalation: "The Ottoman Empire has failed the #bold Balkan Insurgency#!"
 
 balkan_crisis_2.7.t: "The Cyprus Convention"
 balkan_crisis_2.7.d: "[SCOPE.sCountry('offer_scope_fra').GetName] has offered support to [ROOT.GetCountry.GetName] against further aggression, in exchange that we would cede administrative control of [SCOPE.sState('cyprus_state').GetName] to them."
 balkan_crisis_2.7.f: "The aftermath of the #bold Balkan Crisis#! has greatly weakened our position in Europe, and  [SCOPE.sCountry('offer_scope_fra').GetName] is worried that other powers will take advantage of the power vacuum to expand in the region. Of course, no matter how positively they spin the offer, we are essentially giving up our sovereignty over the state."
 balkan_crisis_2.7.a: "We need to secure [SCOPE.sCountry('offer_scope_fra').GetName]'s support through any means."
 balkan_crisis_2.7.b: "Refuse them."
 balkan_crisis_progress_decrease_20_tt: "The progress of #bold Balkan Insurgency#! decreases by #variable 20#!"
 cyprus_convention_tur_tt: "We will give up our sovereignty over [SCOPE.sState('cyprus_state').GetName] to [SCOPE.sCountry('offer_scope_fra').GetName]"
 
 balkan_crisis_2.8.t: "The Crete Convention"
 balkan_crisis_2.9.t: "The Crimea Convention"
