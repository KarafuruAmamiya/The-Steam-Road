  encourage_migration_to_colonies: "Encourage Migration to Colonies"
  encourage_migration_to_colonies_desc: "In order to control overpopulation within the country, we should encourage migration into our colonies, freeing up new opportunities in the mainland."
  no_migration_tt: "We have not promoted migration for 10 years."
  sa_migration.5.c: "Encourage migration to [SCOPE.sCountry('migration_target_3').GetName]."
  sa_migration.5.e: "Nevermind."
  slave_emancipation_act: "Slave Emancipation Act"
  slave_emancipation_act_desc: "The practice of slavery still continues within our own subjects. By passing the act, we can force them to abolish the institution, at the cost of compensating the slave owners."