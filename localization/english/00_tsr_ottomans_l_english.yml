  westernist_coalition_losing_power: "The Westernist Faction is #green losing power#!"
  westernist_progress_increase_mehmed: "The progress bar of the #Bold Westernist Coalition#! [concept_journal_entry] is advanced by #variable #red #Bold 0.3#!#!#! every month as long as Mehmed IV is in another country."
  
  westernist_coalition_suppress_westernist_faction: "Suppress Westernist Faction"
  westernist_coalition_suppress_westernist_faction_desc: "With the decreasing power of the #bold Westernist Faction#!, we must use this opportunity to suppress their activities and prevent them from spreading to other provinces."
  suppress_westernists_cooldown_tt: "Has not used the #bold Suppress Westernist Faction#! decision in the past #bold six months#!"
  mehmed_not_in_country: "[SCOPE.sCharacter('mehmed_scope').GetFirstName] does not reside within our borders"
  mehmed_ruler: "[SCOPE.sCharacter('mehmed_scope').GetFirstName] is our ruler"
  
  ottoman_flavor.3.t: "[SCOPE.sCharacter('mehmed_scope').GetFirstName] Requests Our Aid"
  ottoman_flavor.3.d: "Forced to flee for his life from [SCOPE.sCountry('tur_scope').GetName], [SCOPE.sCharacter('mehmed_scope').GetFirstName], a pretender Sultan who vouches for the Westernization of his empire, has requested asylum in [ROOT.GetCountry.GetName]. If we accept, our indirect support could further the political turmoil within our [SCOPE.sCountry('tur_scope').GetAdjectiveNoFormatting] rivals."
  ottoman_flavor.3.f: "[SCOPE.sCharacter('mehmed_scope').GetFirstName] is the successor of Sultan #bold Orhan II#!, who envisioned a complete Westernization of the Old Order in [SCOPE.sCountry('tur_scope').GetName]. His radical vision led to numerous oppositions, culminating in execution by his brother #bold Selim III#!. However, his son [SCOPE.sCharacter('mehmed_scope').GetFirstName] was safely kept hidden, and a reformist coalition has gathered to reclaim [SCOPE.sCharacter('mehmed_scope').GetFirstName]'s rightful place in the throne and continue the #italic nizam-ı cedid#!."
  ottoman_flavor.3.a: "The Sultan is welcome in [ROOT.GetCountry.GetName]"
  ottoman_flavor.3.b: "We will not be involved in [SCOPE.sCountry('tur_scope').GetName]'s affairs"
  
