  ideology_turkish_nationalist_desc: "#lore This leader demands the creation of a democratic and modernized Turkish state.#!"
  
  je_fractured_porte: "The Fractured Porte"
  je_fractured_porte_01_fail_tt: "Finished the #BOLD Stamp Out Monarchism#! [concept_journal_entry]."
  je_fractured_porte_02_tt: "One of the three vying factions has cemented its rule over the Ottoman Empire."
  #je_fractured_porte_02_fail_tt: "A monarch from outside the House of [SCOPE.GetRootScope.GetCountry.GetCustom('french_dynasty')] sits on the throne"
  #je_fractured_porte_02_fail_2_tt: "We are not actively supporting the House of [SCOPE.GetRootScope.GetCountry.GetCustom('french_dynasty')] as the one true French dynasty"
  je_fractured_porte_03_tt: "The #bold leading faction#! will have an event to put their own pretender Sultan on the Ottoman throne."
  je_fractured_porte_reason:1 "Ever since the death of Sultan Orhan II, the Ottoman Empire has been characterized by intesifying political rivalries. Three contenders to the Ottoman throne has created new factional politics within the empire, each with their own ambitions to solidify or overthrow the current status quo.\n\nThe #bold Caliphatists#!, who favors the current Sultan, #bold Süleyman II#!, continue Orhan II's visions to reject Western influence while expanding the Ottoman's own influence in the Muslim world.\n\nThe #bold Rumelists#!, who backs Süleyman's brother #bold Mehmed IV#!, wishes to modernize the Ottoman Empire in the vein of Western civilization and foster closer relations with them.\n\nThe #bold Metropolitans#!, who rallied behind the pluralistic views of Orhan II's brother, #bold Selim IV#!, represents the interest of minority groups and support a more equal and secularized empire. \n\nAll three factions vie with the powers-that-be and each other to remold the Ottoman Empire in their respective images."
  je_fractured_porte_rumelist_var_tooltip: "#tooltip_header Changes monthly due to the following reasons:#!\n$TOOLTIP_DELIMITER$\n#variable [Country.MakeScope.Var('rumelist_progress_from_characters').GetValue|+=]#! from combined [concept_popularity] of Rumelist characters\n#variable [Country.MakeScope.Var('rumelist_progress_from_igs').GetValue|+=]#! from [concept_clout] of Rumelist [Concept('concept_interest_group', '$concept_interest_groups$')]\n#variable [Country.MakeScope.Var('rumelist_progress_from_factories').GetValue|+=]#! from Industrial [Concept('concept_building_level', '$concept_building_levels$')]\n#variable [Country.MakeScope.Var('rumelist_progress_from_legitimacy').GetValue|+=]#! from [concept_government] [concept_legitimacy]\n#variable [Country.MakeScope.Var('rumelist_progress_from_effects').GetValue|+=]#! from events and other effects"
