 tsr_misc_events.4.t: "The Slave Emancipation Act"
 tsr_misc_events.4.d: "With the ban on slavery in [ROOT.GetCountry.GetName], our government has seen fit to expand the scope of the law towards our administration in [SCOPE.sCountry('slavery_abolished_subject').GetName]. The Act will also provide payments towards [SCOPE.sCountry('slavery_abolished_subject').GetAdjectiveNoFormatting] slave-owners."
 tsr_misc_events.4.f: ""We have no slaves at home – Then why abroad?\nSlaves cannot breathe in [ROOT.GetCountry.GetNameNoFlag]; if their lungs\nReceive our air, that moment they are free.\nThey touch our country, and their shackles fall.\nThat's noble, and bespeaks a nation proud.\nAnd jealous of the blessing. Spread it then,\nAnd let it circulate through every vein.""
 tsr_misc_events.4.a: "Pass the act."
 tsr_misc_events.4.b: "Nevermind."
 
 tsr_misc_events.5.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting] Slavery Act"
 tsr_misc_events.5.d: "The central government in [SCOPE.sCountry('overlord_country').GetName] has mandated the abolition of slavery in [ROOT.GetCountry.GetName] and will provide compensation to the slave-owners."
 tsr_misc_events.5.f: "The Act of [GetGlobalVariable('current_year').GetValue]:\n\n1. No public officer shall in execution of any decree or order of Court, or for the enforcement of any demand of rent or revenue, sell or cause to be sold any person, or the right to the compulsory labour or services of any person on the ground that such person is in a state of slavery.\n2. No rights arising out of an alleged property in the person and services of another as a slave shall be enforced by any Civil or Criminal Court or Magistrate within [ROOT.GetCountry.GetNameNoFlag].\n3. No person who may have acquired property by his own industry, or by the exercise of any art, calling or profession, or by inheritance, assignment, gift or bequest, shall be dispossessed of such property or prevented from taking possession thereof on the ground that such person or that the person from whom the property may have been derived was a slave.\n4. Any act which would be a penal offence if done to a free man shall be equally an offence if done to any person on the pretext of his being in a condition of slavery."
 tsr_misc_events.5.a: "Very well."
 slave_owner_compensation: "Slave-Owners Compensation"